name: UBX RTCM3 Stream Decoder CI

on:
  push:
    branches: [nav]
    paths:
      - "navigation/ubx_rtcm_stream/**"
      - ".github/workflows/ubx-rtcm-stream-parser-ci.yml"
  pull_request:
    branches: [nav]
    paths:
      - "navigation/ubx_rtcm_stream/**"
      - ".github/workflows/ubx-rtcm-stream-parser-ci.yml"
  workflow_dispatch:

concurrency:
  group: ubx-rtcm-stream-parser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-cpp-tests:
    name: C++17 UBX/RTCM3 parser with ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S navigation/ubx_rtcm_stream -B build/ubx_rtcm_stream -DROBODOG_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/ubx_rtcm_stream --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build/ubx_rtcm_stream --output-on-failure

  fuzz-smoke:
    name: Clang libFuzzer smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Clang fuzzer
        env:
          CC: clang
          CXX: clang++
        run: cmake -S navigation/ubx_rtcm_stream -B build/ubx_rtcm_stream-fuzz -DROBODOG_BUILD_FUZZER=ON -DROBODOG_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build fuzzer
        run: cmake --build build/ubx_rtcm_stream-fuzz --target stream_decoder_fuzz --parallel 2
      - name: Run bounded fuzz smoke
        run: timeout 30s build/ubx_rtcm_stream-fuzz/stream_decoder_fuzz -max_total_time=20 -max_len=4096

  thread-sanitizer:
    name: ThreadSanitizer bounded queue concurrency tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure ThreadSanitizer
        run: cmake -S navigation/ubx_rtcm_stream -B build/ubx_rtcm_stream-tsan -DROBODOG_ENABLE_TSAN=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/ubx_rtcm_stream-tsan --parallel 2
      - name: Run concurrency and parser tests
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/ubx_rtcm_stream-tsan --output-on-failure
