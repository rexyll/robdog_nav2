name: Point-LIO UrbanLoco P2 Script Tests

concurrency:
  group: point-lio-urbanloco-p2-tests
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "scripts/urbanloco_gt_helpers.py"
      - "scripts/extract_urbanloco_ulhk4_gt.py"
      - "scripts/audit_urbanloco_ulhk4_db3.py"
      - "scripts/record_point_lio_odometry_tum.py"
      - "scripts/prepare_urbanloco_ulhk4.sh"
      - "scripts/run_urbanloco_ulhk4.sh"
      - "scripts/evaluate_urbanloco_ulhk4.sh"
      - "scripts/tests/test_urbanloco_ulhk4.py"
      - "datasets/external_sha256.txt"
      - "scripts/verify_public_dataset_checksum.sh"
      - "scripts/tests/test_verify_public_dataset_checksum.sh"
      - "scripts/audit_m3dgr_ros1_bag.py"
      - "scripts/tests/test_m3dgr_ros1_bag.py"
      - "scripts/audit_tum_trajectory.py"
      - "scripts/tests/test_tum_trajectory_audit.py"
      - "scripts/convert_m3dgr_dynamic03_to_ros2.py"
      - "scripts/tests/test_convert_m3dgr_dynamic03_to_ros2.py"
      - "requirements-dataset-tools.txt"
      - ".github/workflows/point-lio-urbanloco-p2-tests.yml"
  pull_request:
    paths:
      - "scripts/urbanloco_gt_helpers.py"
      - "scripts/extract_urbanloco_ulhk4_gt.py"
      - "scripts/audit_urbanloco_ulhk4_db3.py"
      - "scripts/record_point_lio_odometry_tum.py"
      - "scripts/prepare_urbanloco_ulhk4.sh"
      - "scripts/run_urbanloco_ulhk4.sh"
      - "scripts/evaluate_urbanloco_ulhk4.sh"
      - "scripts/tests/test_urbanloco_ulhk4.py"
      - "datasets/external_sha256.txt"
      - "scripts/verify_public_dataset_checksum.sh"
      - "scripts/tests/test_verify_public_dataset_checksum.sh"
      - "scripts/audit_m3dgr_ros1_bag.py"
      - "scripts/tests/test_m3dgr_ros1_bag.py"
      - "scripts/audit_tum_trajectory.py"
      - "scripts/tests/test_tum_trajectory_audit.py"
      - "scripts/convert_m3dgr_dynamic03_to_ros2.py"
      - "scripts/tests/test_convert_m3dgr_dynamic03_to_ros2.py"
      - "requirements-dataset-tools.txt"
      - ".github/workflows/point-lio-urbanloco-p2-tests.yml"
  workflow_dispatch:

jobs:
  p2-script-tests:
    name: Python 3.12 parser/geodesy tests and shell syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scripts and pure helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-dataset-tools.txt
          python3 -m py_compile \
            scripts/urbanloco_gt_helpers.py \
            scripts/extract_urbanloco_ulhk4_gt.py \
            scripts/audit_urbanloco_ulhk4_db3.py \
            scripts/record_point_lio_odometry_tum.py \
            scripts/audit_m3dgr_ros1_bag.py \
            scripts/audit_tum_trajectory.py \
            scripts/convert_m3dgr_dynamic03_to_ros2.py
          bash -n \
            scripts/prepare_urbanloco_ulhk4.sh \
            scripts/run_urbanloco_ulhk4.sh \
            scripts/evaluate_urbanloco_ulhk4.sh \
            scripts/verify_public_dataset_checksum.sh \
            scripts/tests/test_verify_public_dataset_checksum.sh
          PYTHONPATH=scripts python3 scripts/extract_urbanloco_ulhk4_gt.py --help >/dev/null
          bash scripts/tests/test_verify_public_dataset_checksum.sh
          PYTHONPATH=scripts python3 -m unittest discover \
            -s scripts/tests \
            -p "test_m3dgr_ros1_bag.py" \
            -v
          PYTHONPATH=scripts python3 -m unittest discover \
            -s scripts/tests \
            -p "test_tum_trajectory_audit.py" \
            -v
          PYTHONPATH=scripts python3 -m unittest discover \
            -s scripts/tests \
            -p "test_convert_m3dgr_dynamic03_to_ros2.py" \
            -v
          PYTHONPATH=scripts python3 -m unittest discover \
            -s scripts/tests \
            -p "test_urbanloco_ulhk4.py" \
            -v
