name: Livox MID-360 Jazzy Build

concurrency:
  group: livox-mid360-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/livox-mid360-ci.yml"
      - ".github/ros2/livox-mid360.repos"
  pull_request:
    paths:
      - ".github/workflows/livox-mid360-ci.yml"
      - ".github/ros2/livox-mid360.repos"
  workflow_dispatch:

jobs:
  jazzy-x86-build:
    name: ROS 2 Jazzy / Ubuntu 24.04 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install ROS 2 Jazzy and build tools
        uses: ros-tooling/setup-ros@0.7.22
        with:
          required-ros-distributions: jazzy

      - name: Install native dependencies and explicit ament build package
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libapr1-dev libeigen3-dev libpcl-dev \
            ros-jazzy-ament-cmake-auto
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build pinned Livox SDK2 v1.3.1
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Livox-SDK/Livox-SDK2.git "$RUNNER_TEMP/Livox-SDK2"
          git -C "$RUNNER_TEMP/Livox-SDK2" checkout --detach f5d9375f84efe2b15bc0a052d3e18482ed13adf4
          cmake -S "$RUNNER_TEMP/Livox-SDK2" -B "$RUNNER_TEMP/Livox-SDK2/build" \
            -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_CXX_FLAGS=-include cstdint'
          cmake --build "$RUNNER_TEMP/Livox-SDK2/build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/Livox-SDK2/build"
          sudo ldconfig

      - name: Checkout exact Livox ROS Driver2 v1.2.6 and select ROS 2 manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/livox_ws/src"
          git clone https://github.com/Livox-SDK/livox_ros_driver2.git \
            "$RUNNER_TEMP/livox_ws/src/livox_ros_driver2"
          git -C "$RUNNER_TEMP/livox_ws/src/livox_ros_driver2" \
            checkout --detach 13eb05e4e6dd7a765b934d0c5fd6236676a57b49
          cp "$RUNNER_TEMP/livox_ws/src/livox_ros_driver2/package_ROS2.xml" \
            "$RUNNER_TEMP/livox_ws/src/livox_ros_driver2/package.xml"
          test "$(grep -c '<buildtool_depend>ament_cmake_auto</buildtool_depend>' \
            "$RUNNER_TEMP/livox_ws/src/livox_ros_driver2/package.xml")" -eq 1

      - name: Resolve ROS 2 Jazzy dependencies
        shell: bash
        run: |
          set -eox pipefail
          source /opt/ros/jazzy/setup.bash
          sudo rosdep init 2>/dev/null || true
          rosdep update
          # The native dependency step clears apt lists to keep the runner lean.
          # Refresh them before rosdep invokes apt-get for package dependencies.
          sudo apt-get update
          rosdep install \
            --from-paths "$RUNNER_TEMP/livox_ws/src" \
            --ignore-src \
            --rosdistro jazzy \
            -r -y

      - name: Build pinned Livox ROS Driver2
        shell: bash
        run: |
          set -eox pipefail
          source /opt/ros/jazzy/setup.bash
          cd "$RUNNER_TEMP/livox_ws"
          colcon build \
            --packages-up-to livox_ros_driver2 \
            --event-handlers console_cohesion+ \
            --symlink-install \
            --cmake-args -DROS_EDITION=ROS2 -DDISTRO_ROS=jazzy
          source install/setup.bash
          ros2 pkg prefix livox_ros_driver2
          ros2 pkg executables livox_ros_driver2
