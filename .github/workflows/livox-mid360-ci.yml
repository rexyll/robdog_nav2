name: Livox MID-360 Jazzy Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/livox-mid360-ci.yml"
      - ".github/ros2/livox-mid360.repos"
      - "docs/implementation/livox_mid360_driver_baseline.md"
  pull_request:
    paths:
      - ".github/workflows/livox-mid360-ci.yml"
      - ".github/ros2/livox-mid360.repos"
      - "docs/implementation/livox_mid360_driver_baseline.md"
  workflow_dispatch:

jobs:
  jazzy-x86-build:
    name: ROS 2 Jazzy / Ubuntu 24.04 x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - name: Checkout project (includes pinned vcstool manifest)
        uses: actions/checkout@v4

      - name: Install native SDK build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git libapr1-dev libeigen3-dev libpcl-dev
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Build pinned Livox SDK2
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Livox-SDK/Livox-SDK2.git /tmp/Livox-SDK2
          git -C /tmp/Livox-SDK2 checkout f5d9375f84efe2b15bc0a052d3e18482ed13adf4
          cmake -S /tmp/Livox-SDK2 -B /tmp/Livox-SDK2/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-include cstdint"
          cmake --build /tmp/Livox-SDK2/build --parallel 2
          cmake --install /tmp/Livox-SDK2/build
          ldconfig

      - name: Build pinned livox_ros_driver2 with ROS tooling
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: livox_ros_driver2
          target-ros2-distro: jazzy
          vcs-repo-file-url: https://raw.githubusercontent.com/rexyll/robdog_nav2/f4cf74ea22cd78f076ae028977d41df349d4e50/.github/ros2/livox-mid360.repos
          skip-tests: true
          coverage-result: false
