name: u-blox ZED-F9P Driver Compatibility Build

on:
  push:
    branches: [main]
    paths:
      - "docs/implementation/zed_f9p_driver_evaluation.md"
      - ".github/workflows/ublox-dgnss-driver-ci.yml"
  pull_request:
    paths:
      - "docs/implementation/zed_f9p_driver_evaluation.md"
      - ".github/workflows/ublox-dgnss-driver-ci.yml"
  workflow_dispatch:

concurrency:
  group: ublox-dgnss-driver-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-driver:
    name: ublox_dgnss 0.7.6 / ${{ matrix.ros_distro }} / ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            ubuntu: jammy
            container_image: ros:humble-ros-base-jammy
          - ros_distro: jazzy
            ubuntu: noble
            container_image: ros:jazzy-ros-base-noble
    container:
      image: ${{ matrix.container_image }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools and native libraries
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git pkg-config libusb-1.0-0-dev libcurl4-openssl-dev \
            python3-colcon-common-extensions python3-rosdep
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Fetch the immutable upstream release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ublox_ws/src"
          git clone --depth 1 --branch 0.7.6 \
            https://github.com/aussierobots/ublox_dgnss.git \
            "$RUNNER_TEMP/ublox_ws/src/ublox_dgnss"
          ACTUAL_SHA="$(git -C "$RUNNER_TEMP/ublox_ws/src/ublox_dgnss" rev-parse HEAD)"
          test "$ACTUAL_SHA" = "9d4f5addbc72d092c57dde99b20712258e96e81e"
          echo "Pinned ublox_dgnss source: $ACTUAL_SHA"

      - name: Resolve ROS dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update
          set +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          rosdep install --from-paths "$RUNNER_TEMP/ublox_ws/src" \
            --ignore-src --rosdistro "${ROS_DISTRO}" -r -y

      - name: Build pinned u-blox driver packages
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          cd "$RUNNER_TEMP/ublox_ws"
          colcon build --packages-up-to ublox_dgnss \
            --event-handlers console_direct+

      - name: Verify required UBX interfaces are installed
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          source "$RUNNER_TEMP/ublox_ws/install/setup.bash"
          set -u
          ros2 pkg prefix ublox_dgnss_node
          ros2 pkg prefix ublox_ubx_msgs
          ros2 interface show ublox_ubx_msgs/msg/UBXNavPVT | grep -q "uint32 itow"
          ros2 interface show ublox_ubx_msgs/msg/UBXNavHPPosLLH | grep -q "uint32 itow"
          ros2 interface show ublox_ubx_msgs/msg/UBXNavCov | grep -q "uint32 itow"
